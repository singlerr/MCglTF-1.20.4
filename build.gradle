plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.17'
    id 'maven-publish'
}

base {
    archivesName = project.archives_base_name
}
version = project.mod_version
group = project.maven_group

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"

        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "CaffeineMC"
        url = "https://maven.caffeinemc.net/releases"

        content {
            includeGroup "net.caffeinemc"
        }
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Uncomment the following line to enable the deprecated Fabric API modules.
    // These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

    // modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
    compileOnly "maven.modrinth:iris:${project.iris_version}"

    if (providers.gradleProperty("irisRuntime").orElse("false").get().toBoolean()) {
        runtimeOnly "maven.modrinth:iris:${project.iris_version}"
        runtimeOnly "net.caffeinemc:sodium-fabric:${project.sodium_version}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter:5.13.4"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.13.4"

}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = "mcgltf-gametest"
        enableGameTests = false
        enableClientGameTests = true
        eula = true
    }
}

def generatedGameTestResources = layout.buildDirectory.dir("generated/gametest/resources")

tasks.register("prepareGameTestModels", Sync) {
    from("test_models") {
        include "*.vrm", "*.vrm.toon.json", "*-toon-*.png"
    }
    into(generatedGameTestResources.map { it.dir("assets/mcgltf-gametest/models") })
}

sourceSets.gametest.resources.srcDir(generatedGameTestResources)
tasks.named("processGametestResources") {
    dependsOn tasks.named("prepareGameTestModels")
}

def shaderPack = providers.gradleProperty("shaderPack")

tasks.register("prepareIrisGameTest") {
    onlyIf { shaderPack.isPresent() }
    inputs.file(shaderPack)
    outputs.dir(layout.buildDirectory.dir("run/clientGameTest/shaderpacks"))
    outputs.file(layout.buildDirectory.file("run/clientGameTest/config/iris.properties"))
    mustRunAfter tasks.named("deleteGameTestRunDir")

    doLast {
        def pack = file(shaderPack.get())
        def runDirectory = layout.buildDirectory.dir("run/clientGameTest").get().asFile
        copy {
            from pack
            into new File(runDirectory, "shaderpacks")
        }
        def configDirectory = new File(runDirectory, "config")
        configDirectory.mkdirs()
        new File(configDirectory, "iris.properties").text = "shaderPack=${pack.name}\nenableShaders=true\n"
    }
}

tasks.named("runClientGameTest") {
    dependsOn tasks.named("prepareIrisGameTest")
    onlyIf { file("test_models/transformed_wakgood.vrm").isFile()
        && file("test_models/transformed_jingburger.vrm").isFile() }
    systemProperty "mcgltf.gametest.requireIris", providers.gradleProperty("requireIris").orElse("false").get()
}

tasks.named("test") {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {

    }
}
