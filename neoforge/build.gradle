plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

base {
    archivesName = 'MCglTF-NeoForge'
}

def generatedGameTestResources = layout.buildDirectory.dir('generated/gametest/resources')

tasks.register('prepareGameTestModels', Sync) {
    from('test_models') {
        include '*.vrm', '*.vrm.toon.json', '*-toon-*.png'
    }
    into(generatedGameTestResources.map { it.dir('assets/mcgltf-gametest/models') })
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
sourceSets.gametest.resources.srcDir(generatedGameTestResources)
tasks.named('processGametestResources') {
    dependsOn tasks.named('prepareGameTestModels')
}

neoForge {
    version = neoforge_version
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = layout.projectDirectory.dir('runs/client').asFile
        }
        server {
            server()
            gameDirectory = layout.projectDirectory.dir('runs/server').asFile
        }
        clientGameTest {
            client()
            gameDirectory = layout.projectDirectory.dir('runs/clientGameTest').asFile
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
        "mcgltf-gametest" {
            sourceSet sourceSets.gametest
        }
    }
}

tasks.named('runClientGameTest') {
    dependsOn tasks.named('prepareGameTestModels')
    onlyIf {
        file('test_models/transformed_wakgood.vrm').isFile()
            && file('test_models/transformed_jingburger.vrm').isFile()
    }
    jvmArgs '-Dmcgltf.gametest.smoke=true'
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'neoforge')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName, it.getTaskName(null, 'jarJar')].each { variant ->
        if (configurations.findByName(variant) != null) {
            configurations.named(variant) {
                attributes {
                    attribute(loaderAttribute, 'neoforge')
                }
            }
        }
    }
}

tasks.withType(Javadoc).configureEach {
    enabled = false
}
